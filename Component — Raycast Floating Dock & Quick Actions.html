<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Component Pattern — Raycast Floating Dock & Quick Actions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #0c0d10;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .raycast-dock {
            background: rgba(22, 24, 29, 0.85);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid #2a2e39;
            border-radius: 9999px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 15px rgba(255, 99, 99, 0.15);
        }

        .dock-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: transparent;
            border-radius: 9999px;
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .dock-item:hover, .dock-item.active {
            background: #22252e;
            color: #fff;
        }

        .kbd-pill {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 4px;
            padding: 2px 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: #ff9f43;
        }
    </style>
</head>
<body>

    <nav class="raycast-dock">
        <div class="dock-item active">🚀 Launchpads <span class="kbd-pill">⌘L</span></div>
        <div class="dock-item">🐙 GitHub Repos <span class="kbd-pill">⌘G</span></div>
        <div class="dock-item">📧 Email Anmol <span class="kbd-pill">⌘E</span></div>
    </nav>

</body>
</html>
