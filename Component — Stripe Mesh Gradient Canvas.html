<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Component Pattern — Stripe Mesh Gradient Canvas</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #0a051b;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            color: #fff;
        }

        .mesh-canvas {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.45), transparent 40%),
                        radial-gradient(circle at 80% 60%, rgba(236, 72, 153, 0.4), transparent 40%),
                        radial-gradient(circle at 50% 90%, rgba(6, 182, 212, 0.35), transparent 50%);
            filter: blur(70px);
            animation: meshMove 16s ease-in-out infinite alternate;
        }

        @keyframes meshMove {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.2) rotate(8deg); }
        }

        .content {
            position: relative;
            z-index: 1;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="mesh-canvas"></div>

    <div class="content">
        <h1 style="font-size: 3rem; font-weight: 800;">Stripe Press Animated Mesh Gradient</h1>
        <p style="color: #cbd5e1;">Ultra-smooth GPU-accelerated liquid background canvas</p>
    </div>

</body>
</html>
