<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Component Pattern — Vercel Border Beam & Shimmer Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <style>
        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        body {
            background-color: #030712;
            color: #f9fafb;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 80px 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .beam-card {
            position: relative;
            background: rgba(17, 24, 39, 0.8);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        /* Animated Border Beam */
        .beam-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 22px;
            padding: 2px;
            background: conic-gradient(from var(--angle), transparent 70%, #06b6d4, #ec4899, transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: rotate-beam 4s linear infinite;
            pointer-events: none;
        }

        @keyframes rotate-beam {
            to { --angle: 360deg; }
        }

        .tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: #06b6d4;
            margin-bottom: 12px;
        }

        .title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .desc {
            color: #9ca3af;
            font-size: 0.95rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="beam-card">
        <div class="tag">VERCEL STYLE PATTERN</div>
        <h2 class="title">Conic Border Beam</h2>
        <p class="desc">Uses pure CSS `@property --angle` with `conic-gradient` mask to render a hardware-accelerated glowing laser beam orbiting the card borders.</p>
    </div>

</body>
</html>
