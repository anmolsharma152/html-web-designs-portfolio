<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Component Pattern — Real-Time Telemetry Gauges</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: #0d1117;
            color: #f0f6fc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .gauges-grid {
            display: flex;
            gap: 30px;
        }

        .gauge-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            min-width: 180px;
        }

        .metric-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2rem;
            font-weight: 700;
            color: #10b981;
            margin-top: 8px;
        }

        .metric-lbl {
            font-size: 0.8rem;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <h2 style="margin-bottom: 24px;">Real-Time System Telemetry Gauges Component</h2>

    <div class="gauges-grid">
        <div class="gauge-card">
            <div class="metric-lbl">VAD LATENCY</div>
            <div class="metric-val">&lt; 150ms</div>
        </div>

        <div class="gauge-card">
            <div class="metric-lbl">AST ACCURACY</div>
            <div class="metric-val">99.4%</div>
        </div>

        <div class="gauge-card">
            <div class="metric-lbl">MEMORY SYNC</div>
            <div class="metric-val">OK</div>
        </div>
    </div>

</body>
</html>
