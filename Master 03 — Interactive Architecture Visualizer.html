<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmol Sharma — Interactive AI Architecture Visualizer</title>
    <meta name="description" content="Interactive AI Architecture & System Visualizer for Anmol Sharma. Features interactive node pipeline diagrams, real-time code drawer snippets, and system telemetry metrics.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --bg-base: #0b0f19;
            --surface-card: #111827;
            --surface-hover: #1f2937;
            --border-card: #1f2937;
            --accent-cyan: #06b6d4;
            --accent-indigo: #6366f1;
            --accent-purple: #a855f7;
            --accent-green: #10b981;
            --text-main: #f9fafb;
            --text-dim: #9ca3af;
            --font-head: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-head);
            overflow-x: hidden;
            line-height: 1.6;
        }

        #three-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
            pointer-events: none;
            opacity: 0.45;
        }

        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1240px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 32px;
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-card);
            border-radius: 9999px;
            margin-bottom: 40px;
        }
        .nav-logo {
            font-weight: 800;
            font-size: 1.2rem;
            color: #fff;
        }

        .section-tag {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--accent-cyan);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .section-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 12px;
        }

        /* ── INTERACTIVE PIPELINE VISUALIZER CARD ────────── */
        .pipeline-card {
            background: var(--surface-card);
            border: 1px solid var(--border-card);
            border-radius: 24px;
            padding: 36px;
            margin-bottom: 50px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .pipeline-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 10px 20px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-card);
            border-radius: 9999px;
            color: var(--text-dim);
            font-family: var(--font-head);
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background: var(--accent-indigo);
            border-color: var(--accent-indigo);
            color: #fff;
        }

        /* DIAGRAM NODES */
        .diagram-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 30px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 18px;
            overflow-x: auto;
            margin-bottom: 24px;
        }
        .node-box {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--accent-cyan);
            border-radius: 14px;
            padding: 16px 20px;
            min-width: 160px;
            text-align: center;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.15);
        }
        .node-box .title { font-weight: 800; color: #fff; font-size: 0.95rem; }
        .node-box .sub { font-family: var(--font-mono); font-size: 0.75rem; color: var(--accent-cyan); margin-top: 4px; }
        .arrow { font-size: 1.4rem; color: var(--accent-indigo); font-weight: 800; }

        /* CODE DRAWER BOX */
        .code-drawer {
            background: #030712;
            border: 1px solid var(--border-card);
            border-radius: 14px;
            padding: 20px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--accent-cyan);
            overflow-x: auto;
        }

        @media (max-width: 800px) {
            .navbar { flex-direction: column; gap: 16px; border-radius: 24px; }
            .diagram-container { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

    <div id="three-canvas"></div>

    <div class="app-container">

        <nav class="navbar">
            <div class="nav-logo">Anmol Sharma</div>
            <div style="color: var(--text-dim); font-size: 0.9rem;">System Dataflow & Architecture Engine</div>
        </nav>

        <section>
            <div class="section-tag">// ARCHITECTURE DATAFLOW VISUALIZER</div>
            <h2 class="section-title">Interactive System Pipelines</h2>
            <p style="color: var(--text-dim); margin-bottom: 30px;">Select a real project system to visualize dataflow, component connections, and real-time execution snippets.</p>

            <div class="pipeline-card">
                
                <!-- PIPELINE TABS -->
                <div class="pipeline-tabs">
                    <button class="tab-btn active" onclick="switchPipeline('disha', this)">01 / Disha (Agentic Memory)</button>
                    <button class="tab-btn" onclick="switchPipeline('vad', this)">02 / vad_processor (Rust/WASM VAD)</button>
                    <button class="tab-btn" onclick="switchPipeline('codex', this)">03 / CodexEngine (Agentic RAG)</button>
                    <button class="tab-btn" onclick="switchPipeline('aura', this)">04 / Aura Daemon (Linux PAM)</button>
                </div>

                <!-- DIAGRAM GRAPH CONTAINER -->
                <div class="diagram-container" id="diagram-view">
                    <!-- Dynamically Injected by JS -->
                </div>

                <!-- CODE DRAWER SNIPPET -->
                <div class="code-drawer" id="code-view">
                    <!-- Dynamically Injected by JS -->
                </div>

            </div>
        </section>

    </div>

    <script>
        const PIPELINE_DATA = {
            disha: {
                nodes: [
                    { title: "User Prompt", sub: "Async Ingestion" },
                    { title: "LangGraph Agent", sub: "State Router" },
                    { title: "pgvector Index", sub: "Semantic Search" },
                    { title: "PostgreSQL DB", sub: "Async Long-Term Memory" }
                ],
                code: `// Disha: LangGraph State Synthesis Node
async def process_user_intent(state: AgentState):
    query_vector = await embed_model.aembed_query(state["user_input"])
    context = await pgvector_client.search_async(
        collection="disha_memories",
        query_vector=query_vector,
        top_k=5
    )
    state["retrieved_context"] = context
    return await langgraph_engine.step(state)`
            },
            vad: {
                nodes: [
                    { title: "Audio Input Stream", sub: "WebRTC / Mic" },
                    { title: "Rust WASM VAD", sub: "ONNX Runtime" },
                    { title: "Voice Detection", sub: "Sub-150ms Output" },
                    { title: "STT / LLM Pipeline", sub: "Stream Handler" }
                ],
                code: `// vad_processor: Client-side Rust WebAssembly VAD Binding
#[wasm_bindgen]
pub struct VadProcessor {
    session: ort::Session,
    sample_rate: usize,
}

#[wasm_bindgen]
impl VadProcessor {
    pub fn is_speech(&mut self, pcm_chunk: &[f32]) -> Result<bool, JsValue> {
        let prob = self.run_onnx_inference(pcm_chunk)?;
        Ok(prob > 0.5)
    }
}`
            },
            codex: {
                nodes: [
                    { title: "Code Query", sub: "FastAPI REST API" },
                    { title: "Hybrid Search", sub: "Vector + Keyword" },
                    { title: "LangGraph Orchestrator", sub: "AST Verification" },
                    { title: "Synthesized Output", sub: "Deterministic Code" }
                ],
                code: `// CodexEngine: Agentic RAG Engine Endpoint
@app.post("/api/v1/synthesize")
async def synthesize_code(req: SynthesisRequest):
    hybrid_context = await hybrid_retriever.search(req.query, k=10)
    ast_result = await agent_graph.run_with_ast_validation(
        query=req.query,
        context=hybrid_context
    )
    return {"status": "success", "ast_verified": True, "code": ast_result}`
            },
            aura: {
                nodes: [
                    { title: "PAM Auth Request", sub: "Linux Login / Sudo" },
                    { title: "Unix Socket Daemon", sub: "Decoupled IPC" },
                    { title: "Biometric Sensor", sub: "Edge Verification" },
                    { title: "PAM Session Grant", sub: "Access Approved" }
                ],
                code: `// Aura: Arch Linux PAM Biometric Authentication Daemon Listener
int pam_sm_authenticate(pam_handle_t *pamh, int flags, int argc, const char **argv) {
    int socket_fd = connect_unix_domain_socket("/var/run/aura.sock");
    if (socket_fd < 0) return PAM_AUTH_ERR;
    
    int auth_status = send_biometric_challenge(socket_fd);
    return (auth_status == 0) ? PAM_SUCCESS : PAM_AUTH_ERR;
}`
            }
        };

        function renderPipeline(key) {
            const data = PIPELINE_DATA[key];
            const diagContainer = document.getElementById('diagram-view');
            diagContainer.innerHTML = '';

            data.nodes.forEach((n, idx) => {
                const nodeDiv = document.createElement('div');
                nodeDiv.className = 'node-box';
                nodeDiv.innerHTML = `<div class="title">${n.title}</div><div class="sub">${n.sub}</div>`;
                diagContainer.appendChild(nodeDiv);

                if (idx < data.nodes.length - 1) {
                    const arrowDiv = document.createElement('div');
                    arrowDiv.className = 'arrow';
                    arrowDiv.textContent = '➔';
                    diagContainer.appendChild(arrowDiv);
                }
            });

            document.getElementById('code-view').innerHTML = `<pre><code>${data.code}</code></pre>`;
        }

        function switchPipeline(key, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderPipeline(key);
        }

        renderPipeline('disha');

        // Three.js Background
        const container = document.getElementById('three-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);
        const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(2.4, 2), new THREE.MeshBasicMaterial({ color: 0x6366f1, wireframe: true, transparent: true, opacity: 0.25 }));
        scene.add(mesh);
        function anim() { requestAnimationFrame(anim); mesh.rotation.x += 0.002; mesh.rotation.y += 0.003; renderer.render(scene, camera); }
        anim();
    </script>
</body>
</html>
